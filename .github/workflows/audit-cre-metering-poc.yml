name: Audit CRE Metering PoC

on:
  push:
    branches:
      - audit-cre-metering-concurrency-v259
  pull_request:
    branches:
      - audit-base-v2.59.0
    paths:
      - core/services/workflows/v2/cre_metering_concurrency_poc_test.go
      - core/services/workflows/v2/cre_evm_write_report_overspend_poc_test.go
      - .github/workflows/audit-cre-metering-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run deterministic PoCs
        run: >-
          go test ./core/services/workflows/v2
          -run '^TestPoC_'
          -count=1
          -v
